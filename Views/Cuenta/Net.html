<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Pokémon</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        header {
            background-color: #ffcc00;
            padding: 20px;
            text-align: center;
        }

        header h1 {
            margin: 0;
            color: #333;
        }

        nav {
            background-color: #333;
            padding: 15px;
            text-align: center;
        }

        nav a {
            color: #fff;
            margin: 0 15px;
            text-decoration: none;
            font-weight: bold;
        }

        nav a:hover {
            text-decoration: underline;
        }

        main {
            padding: 20px;
        }

        .pokemon-container {
            display: flex;
            justify-content: space-around;
            flex-wrap: wrap;
        }

        .pokemon-card {
            background-color: white;
            border: 2px solid #ffcc00;
            border-radius: 10px;
            width: 200px;
            margin: 15px;
            padding: 10px;
            text-align: center;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .pokemon-card img {
            width: 100%;
            border-radius: 10px;
        }

        .pokemon-card h3 {
            margin: 10px 0;
            color: #333;
        }

        footer {
            background-color: #333;
            color: #fff;
            text-align: center;
            padding: 10px;
            position: fixed;
            width: 100%;
            bottom: 0;
        }
    </style>
</head>
<body>

    <header>
        <h1>Bienvenido a la Página de Pokémon</h1>
    </header>

    <nav>
        <a href="#">Inicio</a>
        <a href="#">Pokédex</a>
        <a href="#">Entrenadores</a>
        <a href="#">Batallas</a>
    </nav>

    <main>
        <h2>Algunos Pokémon populares</h2>
        <div class="pokemon-container">
            <div class="pokemon-card">
                <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/001.png" alt="Bulbasaur">
                <h3>Bulbasaur</h3>
            </div>
            <div class="pokemon-card">
                <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/004.png" alt="Charmander">
                <h3>Charmander</h3>
            </div>
            <div class="pokemon-card">
                <img src="https://assets.pokemon.com/assets/cms2/img/pokedex/full/007.png" alt="Squirtle">
                <h3>Squirtle</h3>
            </div>
        </div>
    </main>

    <footer>
        &copy; 2024 Pokémon Fans. Todos los derechos reservados.
    </footer>

</body>
</html>
